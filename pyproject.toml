[project]
name = "tiny-http-link-header"
version = "0.1.0"
description = "Parses HTTP Link headers (RFC 8288) into a list of structured Link objects with their parameters."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
